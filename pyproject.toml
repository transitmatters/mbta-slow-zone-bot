[project]
name = "mbta-slow-zone-bot"
version = "0.3.0"
description = "A Twitter/Mastodon/Bluesky/Slack bot to track MBTA slow zones"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.34.2,<3",
    "tweepy>=4.17.0,<5",
    "Mastodon.py>=2.2.2,<3",
    "atproto>=0.0.73",
    "datadog_lambda~=8.129.0",
]

[dependency-groups]
dev = [
    "chalice~=1.33.0",
    "ruff>=0.17.1",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
