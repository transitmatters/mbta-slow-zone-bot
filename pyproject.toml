[project]
name = "mbta-slow-zone-bot"
version = "0.2.4"
description = "A Twitter/Mastodon/Slack bot to track MBTA slow zones"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tweepy>=4.15.0,<5",
    "Mastodon.py>=1.8.1,<2",
    "atproto>=0.0.57",
    "argparse>=1.4.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pre-commit>=4.4.0",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
