name: refresh_threads_token

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # Every Monday, Threads tokens expire after 60 days

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.THREADS_SECRET_WRITER_PAT }}
    steps:
      - name: Refresh Threads access token
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body --get "https://graph.threads.net/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=${THREADS_ACCESS_TOKEN}")
          new_token=$(echo "$response" | jq -r '.access_token // empty')
          if [ -z "$new_token" ]; then
            echo "Threads token refresh returned no access_token"
            exit 1
          fi
          echo "::add-mask::$new_token"
          gh secret set THREADS_ACCESS_TOKEN --body "$new_token" --repo "${{ github.repository }}"
          echo "Refreshed Threads token, expires in $(echo "$response" | jq -r '.expires_in') seconds"
