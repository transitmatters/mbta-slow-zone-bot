name: dry_run

on:
  pull_request:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      # chalice package needs a region, but no credentials
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run MBTA Slow Zone Bot in Dry Run mode
        run: uv run python -m slowzonebot.chalicelib.slowzones --dry-run
      - name: Package Chalice app (no deploy)
        run: |
          uv export --no-hashes --no-dev > slowzonebot/requirements.txt
          cd slowzonebot
          uv run chalice package --stage prod --merge-template .chalice/resources.json cfn/
