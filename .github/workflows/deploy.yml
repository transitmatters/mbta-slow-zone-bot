name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize deploys: CloudFormation rejects a change set while the stack is
# UPDATE_IN_PROGRESS, which silently drops the later of two close merges.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_PROFILE: transitmatters
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ACCESS_SECRET: ${{ secrets.ACCESS_SECRET }}
      CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
      CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
      BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
      MASTODON_CLIENT_KEY: ${{ secrets.MASTODON_CLIENT_KEY }}
      MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      ATP_AUTH_HANDLE: ${{ secrets.ATP_AUTH_HANDLE }}
      ATP_AUTH_PASSWORD: ${{ secrets.ATP_AUTH_PASSWORD }}
      SLOW_ZONE_BOT_SLACK_WEBHOOK_URL: ${{ secrets.SLOW_ZONE_BOT_SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Generate AWS profile
        run: |
          mkdir ~/.aws
          cat >> ~/.aws/credentials << EOF
          [$AWS_PROFILE]
          aws_access_key_id = $AWS_ACCESS_KEY_ID
          aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          EOF
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run deploy shell script
        run: |
          bash devops/deploy.sh
