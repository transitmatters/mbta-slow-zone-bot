name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint and check formatting of backend code with Ruff
        run: |
          uv run ruff check slowzonebot
          uv run ruff format slowzonebot --check
