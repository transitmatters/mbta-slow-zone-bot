name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Lint and check formatting of backend code with Ruff
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format . --check
